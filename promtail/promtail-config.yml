server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: caddy-access-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: caddy
          __path__: /var/log/caddy/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            status: status
            method: request.method
            uri: request.uri
            client_ip: request.remote_ip
            host: request.host
            duration: duration
      - labels:
          status:
          method:
          host:
