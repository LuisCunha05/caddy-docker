services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: caddy-crowdsec-ratelimit:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      # Tells Caddy which network to proxy traffic through for auto-discovery
      - CADDY_INGRESS_NETWORKS=caddy_net
    networks:
      - caddy_net
      - monitoring_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # REQUIRED for label auto-discovery
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy_logs:/var/log/caddy # Shared logs volume for CrowdSec

    # GLOBAL CADDY CONFIGURATION VIA DOCKER LABELS (NO CADDYFILE REQUIRED)
    labels:
      # Enable caddy-docker-proxy on this instance
      caddy_docker_proxy: "true"
      caddy.metrics.per_host: ""

      # 1. Global Admin Email for ACME SSL (Let's Encrypt / ZeroSSL)
      caddy.email: "${EMAIL_TLS}"

      # 2. Expose internal Admin & Metrics endpoint for Prometheus
      caddy.admin: "0.0.0.0:2019"

      # 3. Global Logging Configuration for CrowdSec Log Acquisition
      caddy.log.output: "file /var/log/caddy/access.log"
      caddy.log.format: "json"
      caddy.log.level: "INFO"

      # 4. Global Directive Order (CRITICAL for security pipeline execution)
      # Evaluates CrowdSec ban check -> Rate Limit -> Reverse Proxy
      caddy.order_0: "crowdsec before rate_limit"
      caddy.order_1: "rate_limit before reverse_proxy"

      # 5. CrowdSec Bouncer Global Configuration Block
      caddy.crowdsec.api_url: "http://crowdsec:8080"
      caddy.crowdsec.api_key: "${CROWDSEC_BOUNCER_API_KEY}"
      # Uncomment if using CrowdSec AppSec WAF feature:
      caddy.crowdsec.appsec_url: "http://crowdsec:7422"

  crowdsec:
    image: crowdsecurity/crowdsec:${CROWDSEC_VERSION}
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      # Listen on all interfaces inside caddy_net
      - CROWDSEC_LAPI_LISTEN_URI=0.0.0.0:8080
      # Uncomment if using AppSec WAF:
      - CROWDSEC_APPSEC_LISTEN_URI=0.0.0.0:7422
    networks:
      - monitoring_net
    volumes:
      - ./crowdsec-db:/var/lib/crowdsec/data
      - ./crowdsec-config:/etc/crowdsec
      - ./caddy_logs:/var/log/caddy:ro


networks:
  caddy_net:
    external: true
  monitoring_net:
    external: true

volumes:
  caddy_data:
  caddy_config:
  crowdsec-db:
